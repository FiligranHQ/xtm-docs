# Journeys: an outcome reached through several pages, possibly across modules. A page of a
# journey shows its steps to the reader who chose it; /workflows/ lists every journey, and the home
# the last three of this list (write a new one at the end). `shot` is the screen of the outcome the
# card shows (or `diagram`, drawn small). A step not published yet shows as coming soon.
- id: automate-intelligence
  title: Automate threat intelligence
  outcome: New intelligence is filtered, enriched, saved and shared without anyone touching it, and AI agents take over the follow-up.
  products: [opencti, xtm-one]
  shot: opencti-playbook-canvas
  steps:
    - {url: /opencti/use/automate/playbooks/, label: Understand playbooks}
    - {url: /opencti/use/automate/playbooks/choose-a-component/, label: Choose components}
    - {url: /opencti/use/automate/playbooks/create/, label: Build and start}
    - {url: /opencti/use/automate/playbooks/monitor/, label: Monitor runs}
- id: threat-informed-validation
  title: Check your defenses against the threats you track
  outcome: Threats known in OpenCTI become OpenAEV scenarios on your own endpoints, your security tools' alerts score each step, the results come back as security coverage, OpenCRQ prices the gaps they leave, and XTM One summarizes it.
  products: [opencti, openaev, opencrq, xtm-one]
  shot: openaev-simulations-execution
  steps:
    - {url: /openaev/use/agents/, label: Install agents on the endpoints}
    - {url: /openaev/use/collectors/, label: Let your security tools score it}
    - {url: /openaev/configure/asset-rules/, label: Aim the tests at the right endpoints}
    - {url: /opencti/use/analyze/security-coverage/, label: Ask for a security coverage}
    - {url: /openaev/use/scenarios/from-opencti/, label: Fill the gaps of the scenario}
    - {url: /openaev/use/simulations/, label: Run the simulation}
    - {url: /openaev/use/expectations/, label: Read what was prevented and detected}
    - {url: /opencrq/use/sources/openaev/, label: Price the gaps in OpenCRQ}
    - {url: /xtm-one/use/in-openaev/, label: Summarize with XTM One}

