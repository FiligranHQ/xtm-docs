    tone: product
    nodes:
      - {id: scenario, label: Replay scheduled, icon: LogoOpenAEV, note: "Velvet Harbor replay, weekly", href: /openaev/use/scenarios/build/}
      - {id: edr, label: EDR runs it, icon: ShieldCheck, note: "Meridian EDR raises alerts", href: /openaev/use/executors/}
      - {id: collector, label: Steps scored, icon: Activity, note: "From the EDR's alerts", href: /openaev/use/collectors/}
      - {id: trend, label: Drop flagged, icon: Gauge, note: "Dashboard and trigger", href: /openaev/configure/notifications/}
  - label: XTM One
    tone: core
    nodes:
      - {id: agent, label: Rule written, icon: LogoXTMOne, note: "Night shift triage, Sigma skill", href: /xtm-one/build/skills/}
edges:
