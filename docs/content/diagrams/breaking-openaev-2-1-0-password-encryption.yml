title: From OpenAEV 2.1.0, a key and a salt set before the start let OpenAEV encrypt the secrets of integrations in its database, so keep both with your backups
lanes:
  - label: Configuration (.env)
    tone: external
    nodes:
      - {id: key, label: Encryption key, icon: KeyRound, note: OPENAEV_ADMIN_ENCRYPTION_KEY}
      - {id: salt, label: Encryption salt, icon: KeyRound, note: "OPENAEV_ADMIN_ENCRYPTION_SALT, at least 8 bytes"}
  - label: OpenAEV 2.1.0 and later
    tone: product
    nodes:
      - {id: platform, label: OpenAEV, icon: LogoOpenAEV, note: Derives a 256-bit key}
  - label: Storage
    tone: store
    nodes:
      - {id: database, label: Integration configuration, icon: Server, note: Passwords and secrets encrypted}
      - {id: backups, label: Your backups, icon: History, note: A copy of the key and the salt}
edges:
  - {from: key, to: platform, label: set before start}
  - {from: salt, to: platform, label: set before start}
  - {from: platform, to: database, label: encrypts and reads, both: true}
  - {from: key, to: backups, label: keep a copy, style: dashed}
  - {from: salt, to: backups, label: keep a copy, style: dashed}
