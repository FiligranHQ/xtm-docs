title: Inside the Docker network the containers reach each other by service name, each link with its token, while users reach the platforms on their host ports
lanes:
  - label: Integrations
    tone: external
    nodes:
      - {id: integrations, label: Workers and integrations, icon: Puzzle, note: "Connectors, collectors, injectors, XTM Composer"}
  - label: Platforms
    tone: product
    nodes:
      - {id: opencti, label: OpenCTI, icon: LogoOpenCTI, note: "http://opencti:8080, host port 8080"}
      - {id: openaev, label: OpenAEV, icon: LogoOpenAEV, note: "http://openaev:8080, host port 8081"}
      - {id: opencrq, label: OpenCRQ, icon: LogoOpenCRQ, note: "http://opencrq:3002, host port 8082"}
  - label: At the center
    tone: core
    nodes:
      - {id: xtmone, label: XTM One, icon: LogoXTMOne, note: "http://xtm-one:4000, host port 8090"}
  - label: Shared services
    tone: store
    nodes:
      - {id: stores, label: Shared services, icon: Layers, note: "elasticsearch:9200, rabbitmq:5672, redis:6379, minio:9000, pgsql:5432"}
edges:
  - {from: integrations, to: opencti, label: OPENCTI_ADMIN_TOKEN}
  - {from: integrations, to: openaev, label: OPENAEV_ADMIN_TOKEN}
  - {from: opencti, to: openaev, label: admin tokens, both: true}
  - {from: opencti, to: xtmone, label: PLATFORM_REGISTRATION_TOKEN, both: true}
  - {from: openaev, to: xtmone, label: PLATFORM_REGISTRATION_TOKEN, both: true}
  - {from: opencrq, to: xtmone, label: PLATFORM_REGISTRATION_TOKEN, both: true}
  - {from: opencrq, to: opencti, label: token of each tenant}
  - {from: opencrq, to: openaev, label: token of each tenant}
  - {from: opencti, to: stores, label: by service name}
  - {from: openaev, to: stores, label: by service name}
  - {from: xtmone, to: stores, label: by service name}
  - {from: opencrq, to: stores, label: by service name}
