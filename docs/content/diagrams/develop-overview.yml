title: Your code reaches the XTM products through their APIs, or runs beside them as an integration
lanes:
  - label: What you write
    tone: external
    nodes:
      - {id: script, label: Script or app, icon: Code2, note: "curl, Python, an AI agent", href: /develop/apis/}
      - {id: integration, label: Integration, icon: Puzzle, note: "Connector, collector, injector", href: /develop/integration-model/}
      - {id: change, label: Contribution, icon: GitBranch, note: A change to a product, href: /develop/contribute/build-from-source/}
  - label: How it gets in
    tone: product
    nodes:
      - {id: mcp, label: MCP and chat API, icon: LogoXTMOne, note: XTM One, href: /develop/apis/mcp/}
      - {id: graphql, label: GraphQL API and streams, icon: LogoOpenCTI, note: OpenCTI, href: /develop/apis/graphql/}
      - {id: rest, label: REST API, icon: LogoOpenAEV, note: OpenAEV and XTM One, href: /develop/apis/rest/}
  - label: Where it lands
    tone: store
    nodes:
      - {id: products, label: The XTM products, icon: Layers, note: With the rights of its user}
edges:
  - {from: script, to: mcp}
  - {from: script, to: graphql, label: calls}
  - {from: script, to: rest}
  - {from: integration, to: graphql, label: registers}
  - {from: integration, to: rest}
  - {from: mcp, to: products}
  - {from: graphql, to: products, label: reads and writes}
  - {from: rest, to: products}
