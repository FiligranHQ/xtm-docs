title: A secret field holds a reference, and the platform reads the secret from your vault each time it uses it
lanes:
  - label: Your vault
    tone: external
    nodes:
      - {id: vault, label: Secret vault, icon: KeyRound, note: "HashiCorp, AWS, GCP, Azure, 1Password"}
  - label: XTM One
    tone: core
    nodes:
      - {id: field, label: Secret field, icon: FileText, note: "vault://corp/path#key"}
      - {id: cache, label: Memory cache, icon: Clock, note: "300 seconds by default"}
  - label: Uses
    tone: product
    nodes:
      - {id: integration, label: Integrations, icon: Puzzle, note: "API keys, bot tokens"}
      - {id: providers, label: LLM providers, icon: Cpu, note: "API keys"}
edges:
  - {from: field, to: cache, label: resolved through}
  - {from: cache, to: vault, label: read when expired}
  - {from: cache, to: integration, label: value in memory}
  - {from: cache, to: providers, label: value in memory}
