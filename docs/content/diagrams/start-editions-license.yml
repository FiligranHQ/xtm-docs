title: A Filigran license turns the Enterprise Edition on in OpenCTI while it is valid
lanes:
  - label: Filigran
    tone: external
    nodes:
      - {id: license, label: License certificate, icon: KeyRound, note: 'Trial, standard or LTS'}
  - label: Where you set it
    tone: product
    nodes:
      - {id: ui, label: Interface, icon: Wrench, note: Settings > Parameters}
      - {id: config, label: Configuration, icon: FileText, note: APP__ENTERPRISE_EDITION_LICENSE}
      - {id: xtmone, label: XTM One, icon: LogoXTMOne, note: From OpenCTI 7.261030}
  - label: OpenCTI
    tone: product
    nodes:
      - {id: check, label: License check, icon: ShieldCheck, note: 'Signature, scope, dates'}
  - label: Edition
    tone: core
    nodes:
      - {id: ee, label: Enterprise Edition, icon: Gem, note: Features on}
      - {id: ce, label: Community Edition, icon: Layers, note: Data kept}
edges:
  - {from: license, to: ui, label: paste}
  - {from: license, to: config, label: set at deployment}
  - {from: license, to: xtmone, label: install}
  - {from: ui, to: check}
  - {from: config, to: check, label: replaces the interface}
  - {from: xtmone, to: check, label: at registration}
  - {from: check, to: ee, label: valid}
  - {from: check, to: ce, label: missing or expired, style: dashed}
