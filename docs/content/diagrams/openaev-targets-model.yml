      - {id: groups, label: Asset groups, icon: Boxes, note: By hand or by rule, href: /openaev/use/targets/assets/}
  - label: People
    tone: external
    nodes:
      - {id: persons, label: Persons, icon: Users, note: "Email, phone, PGP key", href: /openaev/use/targets/people/}
