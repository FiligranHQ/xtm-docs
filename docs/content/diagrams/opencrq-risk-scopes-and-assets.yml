    tone: store
    nodes:
      - {id: web, label: Booking web application, icon: Network, note: Internet-facing}
      - {id: db, label: Booking database server, icon: Server, note: Internal}
      - {id: account, label: night.audit account, icon: KeyRound, note: Front-desk identity}
  - label: Primary assets
    tone: product
    nodes:
      - {id: guests, label: Guest records, icon: FileText, note: Personal data}
