  - {from: web, to: guests, label: processes}
  - {from: web, to: booking, label: performs}
  - {from: account, to: guests, label: reads}
  - {from: guests, to: scenario, label: targeted by}
  - {from: guests, to: scope, label: belongs to}
  - {from: booking, to: scope, label: belongs to}
