title: An integration holds the connection to a service; an agent bound to it gets its read and write tools, narrowed by its tool scope
lanes:
  - label: Services
    tone: external
    nodes:
      - {id: saas, label: Your tools, icon: Puzzle, note: "Jira, Slack, Microsoft 365"}
      - {id: suite, label: Registered products, icon: LogoOpenCTI, note: "OpenCTI, OpenAEV, OpenCRQ"}
  - label: Integrations
    tone: core
    nodes:
      - {id: integ, label: Integration, icon: KeyRound, note: "Credentials, read and write tools"}
      - {id: platform, label: Platform-managed, icon: ShieldCheck, note: Each user's own token}
  - label: Agents
    tone: core
    nodes:
      - {id: agent, label: AI agent, icon: Bot, note: Tool scope, href: /xtm-one/build/agents/}
edges:
  - {from: integ, to: saas, label: OAuth or API key}
  - {from: platform, to: suite, label: as the user}
  - {from: agent, to: integ, label: bound}
  - {from: agent, to: platform, label: bound}
