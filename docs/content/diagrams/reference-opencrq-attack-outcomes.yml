title: An attack reaches the tactic that realizes its outcome, mostly after getting in, and the outcome breaches the primary asset
lanes:
  - label: The attack
    tone: external
    nodes:
      - {id: access, label: Initial access, icon: LogIn, note: 'Phishing, an exposed service'}
      - {id: path, label: Attack path, icon: GitBranch, note: Toward the primary assets}
      - {id: outside, label: Without a foothold, icon: Network, note: 'DDoS, some payment fraud'}
  - label: Ends on
    tone: product
    nodes:
      - {id: exfil, label: Exfiltration, icon: ArrowUpRight, note: "Data theft extortion, data breach and resale, espionage"}
      - {id: impact, label: Impact, icon: TriangleAlert, note: "Ransomware, fraud, disruption, destruction"}
  - label: The business
    tone: store
    nodes:
      - {id: asset, label: Primary asset, icon: Layers, note: 'Availability, integrity, confidentiality, traceability'}
edges:
  - {from: access, to: path}
  - {from: path, to: exfil, label: data outcomes}
  - {from: path, to: impact, label: disruption outcomes}
  - {from: outside, to: impact, label: no initial access, style: dashed}
  - {from: exfil, to: asset, label: breaches}
  - {from: impact, to: asset, label: breaches}
