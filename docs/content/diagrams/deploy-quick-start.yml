title: You clone xtm-docker, create .env with one command and start the whole stack with another, then sign in to each platform on localhost
lanes:
  - label: Get
    tone: external
    nodes:
      - {id: clone, label: git clone, icon: GitBranch, note: FiligranHQ/xtm-docker}
  - label: Configure
    tone: external
    nodes:
      - {id: env, label: .env, icon: FileText, note: "docker compose -f init.yml run --rm init"}
  - label: Start
    tone: product
    nodes:
      - {id: up, label: docker compose up -d, icon: Terminal, note: "--pull always"}
  - label: Platforms
    tone: product
    nodes:
      - {id: xtmone, label: XTM One, icon: LogoXTMOne, note: "localhost:8090"}
      - {id: opencti, label: OpenCTI, icon: LogoOpenCTI, note: "localhost:8080"}
      - {id: openaev, label: OpenAEV, icon: LogoOpenAEV, note: "localhost:8081"}
      - {id: opencrq, label: OpenCRQ, icon: LogoOpenCRQ, note: "localhost:8082"}
  - label: You
    tone: external
    nodes:
      - {id: signin, label: Sign in, icon: LogIn, note: "Admins of .env, OpenCRQ through XTM One"}
edges:
  - {from: clone, to: env, label: random secrets}
  - {from: env, to: up}
  - {from: up, to: xtmone, label: starts}
  - {from: up, to: opencti, label: starts}
  - {from: up, to: openaev, label: starts}
  - {from: up, to: opencrq, label: starts}
  - {from: xtmone, to: signin, label: healthy}
  - {from: opencti, to: signin, label: healthy}
  - {from: openaev, to: signin, label: healthy}
  - {from: opencrq, to: signin, label: healthy}
