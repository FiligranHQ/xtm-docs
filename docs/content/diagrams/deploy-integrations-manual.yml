title: An integration you run yourself registers with its platform with its own token and identifier, and reaches RabbitMQ at the address the platform gives it
lanes:
  - label: You run it
    tone: external
    nodes:
      - {id: compose, label: Docker Compose service, icon: Boxes, note: "On the xtm_default network"}
      - {id: python, label: Python program, icon: Terminal, note: Settings in config.yml}
  - label: Platforms
    tone: product
    nodes:
      - {id: opencti, label: OpenCTI, icon: LogoOpenCTI, note: "http://opencti:8080"}
      - {id: openaev, label: OpenAEV, icon: LogoOpenAEV, note: "http://openaev:8080"}
  - label: Queues
    tone: store
    nodes:
      - {id: rabbitmq, label: RabbitMQ, icon: Server, note: "Or MQ_HOST, MQ_PORT to override"}
edges:
  - {from: compose, to: opencti, label: "URL, token, ID"}
  - {from: compose, to: openaev, label: "URL, token, ID"}
  - {from: python, to: opencti, label: same settings, style: dashed}
  - {from: python, to: openaev, label: same settings, style: dashed}
  - {from: compose, to: rabbitmq, label: address from platform}
  - {from: python, to: rabbitmq, label: address from platform}
