title: Each phishing step starts green and turns red when the person does it, a later step turning the earlier ones red, while a mail gateway's hits leave it green
lanes:
  - label: What happens
    tone: external
    nodes:
      - {id: open, label: Pixel loaded, icon: MessageSquare, note: Email opened}
      - {id: click, label: Page opened, icon: Laptop, note: Link followed}
      - {id: submit, label: Form submitted, icon: KeyRound, note: Credentials typed}
      - {id: scanner, label: Gateway or scanner, icon: Bot, note: "Within 10 s, or a known scanner"}
  - label: Steps of the person
    tone: product
    nodes:
      - {id: s1, label: Email not opened, icon: ClipboardCheck, note: Red}
      - {id: s2, label: Link not clicked, icon: ClipboardCheck, note: "Red, with step 1"}
      - {id: s3, label: Credentials not submitted, icon: ClipboardCheck, note: "Red, with steps 1 and 2"}
      - {id: ignored, label: Step stays green, icon: ShieldCheck, note: Likely automated}
  - label: Team
    tone: product
    nodes:
      - {id: team, label: Team verdict, icon: Users, note: By its validation rule}
edges:
  - {from: open, to: s1, label: turns red}
  - {from: click, to: s2, label: turns red}
  - {from: submit, to: s3, label: turns red}
  - {from: scanner, to: ignored, label: annotated only, style: dashed}
  - {from: s3, to: team, label: recomputed}
