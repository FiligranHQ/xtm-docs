    tone: external
    nodes:
      - {id: screens, label: OpenCTI screens, icon: Sparkles, note: "Ask Ariane, Ask AI, AI Insights, search"}
      - {id: playbooks, label: Playbooks, icon: Workflow, note: AI agent steps, href: /opencti/use/automate/playbooks/}
      - {id: clients, label: AI clients, icon: Laptop, note: "Cursor, Claude Desktop"}
  - label: OpenCTI
    tone: product
    nodes:
      - {id: opencti, label: OpenCTI, icon: LogoOpenCTI, note: Signs a token for you}
  - label: XTM One
    tone: core
    nodes:
